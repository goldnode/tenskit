[package]
name = "tenspile"
version = "0.1.0"
edition = "2021"
description = "Inspect and edit tensor container files"
authors = ["Nick Reynolds (goldnode)"]
license = "MIT"
repository = "https://github.com/goldnode/tenspile"
readme = "README.md"
publish = false

[[bin]]
name = "tenspile"
path = "src/main.rs"

[[bin]]
name = "tensdiff"
path = "src/tensdiff.rs"

[[bin]]
name = "tensconv"
path = "src/tensconv.rs"

[[bin]]
name = "tensquant"
path = "src/tensquant.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = false
codegen-units = 1
