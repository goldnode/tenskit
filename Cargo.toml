[package]
name = "tenskit"
version = "0.4.0"
edition = "2021"
description = "Utilities to inspect, edit, compare, convert, and quantize tensor container files"
authors = ["Nick Reynolds (goldnode)"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/goldnode/tenskit"
readme = "README.md"
publish = false

[[bin]]
name = "tenspile"
path = "src/tenspile.rs"

[[bin]]
name = "tensdiff"
path = "src/tensdiff.rs"

[[bin]]
name = "tensconv"
path = "src/tensconv.rs"

[[bin]]
name = "tensquant"
path = "src/tensquant.rs"

[[bin]]
name = "tensinfo"
path = "src/tensinfo.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
sha2 = "0.10"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = false
codegen-units = 1
